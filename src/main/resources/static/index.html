<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent</title>
  <style>
    :root{--bg:#0f1220;--panel:#171b2e;--line:#262b45;--text:#e8eaf6;--mute:#8d93b5;--acc:#6c8cff;--ok:#38d39f;--err:#ff6b81}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex}
    .chat{flex:1;display:flex;flex-direction:column;min-width:0}
    header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#a66cff);display:grid;place-items:center;font-weight:700}
    header h1{font-size:18px;margin:0}header small{color:var(--mute)}
    #msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
    .m{max-width:78%;padding:12px 15px;border-radius:14px;line-height:1.55;font-size:15px;word-wrap:break-word}
    .m.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
    .m.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
    .m.err{border-color:var(--err);color:var(--err)}
    .m pre{background:#0b0e1b;padding:10px;border-radius:8px;overflow-x:auto}
    .m code{background:#0b0e1b;padding:1px 5px;border-radius:4px;font-size:13px}.m pre code{padding:0}
    .m p{margin:0 0 8px}.m p:last-child{margin:0}.m ul{margin:4px 0 8px;padding-left:20px}
    form{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
    textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;max-height:140px}
    textarea:focus{outline:none;border-color:var(--acc)}
    button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    aside{width:300px;border-left:1px solid var(--line);background:var(--panel);padding:20px;overflow-y:auto}
    aside h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
    .step{display:flex;gap:12px;margin-bottom:18px;opacity:.4;transition:.25s}
    .step.active,.step.done,.step.fail{opacity:1}
    .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
    .step.active .dot{border-color:var(--acc);animation:p 1s infinite}
    .step.done .dot{background:var(--ok);border-color:var(--ok);color:#06241a}
    .step.fail .dot{background:var(--err);border-color:var(--err);color:#fff}
    .step b{display:block;font-size:14px}.step span{font-size:12px;color:var(--mute)}
    @keyframes p{50%{box-shadow:0 0 0 5px rgba(108,140,255,.25)}}
    @media(max-width:760px){aside{display:none}.m{max-width:92%}}
  </style>
</head>
<body>
<div class="chat">
  <header><div class="logo">AI</div><div><h1>AI Agent</h1><small>Spring Boot + Spring AI + Gemini</small></div></header>
  <div id="msgs"><div class="m bot">Hi! I'm your AI Agent. Ask me anything.</div></div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Type your question… (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="b">Send</button>
  </form>
</div>
<aside>
  <h2>Agent working process</h2>
  <div id="steps">
    <div class="step" data-s="0"><div class="dot"></div><div><b>1. Prompt received</b><span>Your question is read from the chat box</span></div></div>
    <div class="step" data-s="1"><div class="dot"></div><div><b>2. Sent to Spring Boot</b><span>GET /askany?question=…</span></div></div>
    <div class="step" data-s="2"><div class="dot"></div><div><b>3. Gemini is thinking</b><span>ChatClient → prompt() → call()</span></div></div>
    <div class="step" data-s="3"><div class="dot"></div><div><b>4. Response ready</b><span id="timing">—</span></div></div>
  </div>
</aside>
<script>
  const msgs=document.getElementById('msgs'),q=document.getElementById('q'),b=document.getElementById('b'),f=document.getElementById('f');
  const steps=[...document.querySelectorAll('.step')];

  function setStep(i,state){steps.forEach((s,j)=>{s.classList.remove('active','done','fail');
    if(j<i)s.classList.add('done'); if(j===i)s.classList.add(state);});
    steps.forEach((s,j)=>{const d=s.querySelector('.dot');d.textContent=s.classList.contains('done')?'✓':s.classList.contains('fail')?'!':''});}
  function resetSteps(){steps.forEach(s=>{s.classList.remove('active','done','fail');s.querySelector('.dot').textContent=''});document.getElementById('timing').textContent='—';}

  const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function md(t){
    t=esc(t);
    t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre><code>'+c+'</code></pre>');
    t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
    t=t.replace(/(^|\n)[*-] (.+)/g,'$1<li>$2</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
    return t.split(/\n{2,}/).map(p=>/^<(pre|ul)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  }
  function add(cls,html,isText){const d=document.createElement('div');d.className='m '+cls;
    isText?d.textContent=html:d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}

  async function send(){
    const text=q.value.trim(); if(!text)return;
    q.value='';b.disabled=true;resetSteps();
    add('user',text,true); setStep(0,'active');
    const t0=performance.now(); const wait=add('bot','Thinking…',true);
    try{
      await new Promise(r=>setTimeout(r,250)); setStep(1,'active');
      await new Promise(r=>setTimeout(r,250)); setStep(2,'active');
      const res=await fetch('/askany?question='+encodeURIComponent(text));
      const body=await res.text();
      if(!res.ok) throw new Error(body||('HTTP '+res.status));
      wait.innerHTML=md(body); setStep(3,'done');
      steps[3].classList.add('done');steps[3].querySelector('.dot').textContent='✓';
      document.getElementById('timing').textContent='Completed in '+((performance.now()-t0)/1000).toFixed(1)+'s';
    }catch(e){
      wait.classList.add('err'); wait.textContent=e.message||'Could not reach the server.';
      const cur=steps.findIndex(s=>s.classList.contains('active')); setStep(cur<0?2:cur,'fail');
    }finally{b.disabled=false;q.focus();msgs.scrollTop=msgs.scrollHeight;}
  }
  f.addEventListener('submit',e=>{e.preventDefault();send()});
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  q.addEventListener('input',()=>{q.style.height='auto';q.style.height=q.scrollHeight+'px'});
</script>
</body>
</html>
